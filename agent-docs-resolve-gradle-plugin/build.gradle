plugins {
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '2.0.0'
}

dependencies {
    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

gradlePlugin {
    website = 'https://github.com/duckasteroid/agent-docs'
    vcsUrl  = 'https://github.com/duckasteroid/agent-docs'
    plugins {
        agentDocs {
            id = 'io.github.duckasteroid.agent-docs'
            implementationClass = 'io.github.duckasteroid.agentdocs.resolve.AgentDocsResolvePlugin'
            displayName = 'Agent Docs Plugin'
            tags  = ['AI Agent', 'documentation', 'publishing']
            description = 'Resolves dependency sidecars into project-local skill folders and generates agent skills in single-index, per-dependency, or threshold-based auto mode'
        }
    }
}
