plugins {
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '2.0.0'
}

dependencies {
    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

gradlePlugin {
    website = 'https://github.com/duckasteroid/agent-docs'
    vcsUrl  = 'https://github.com/duckasteroid/agent-docs'
    plugins {
        agentDocsResolve {
            id = 'io.github.duckasteroid.agent-docs.resolve'
            implementationClass = 'io.github.duckasteroid.agentdocs.resolve.AgentDocsResolvePlugin'
            displayName = 'Agent Docs Resolve Plugin'
            tags  = ['AI Agent', 'documentation', 'publishing']
            description = 'Creates an agent docs local repository for resolved Gradle dependencies. This is then suitable for use by the MCP tool to serve agent docs'
        }
    }
}
