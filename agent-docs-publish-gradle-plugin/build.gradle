plugins {
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '2.0.0'
}

dependencies {
    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

def gradle8TestVersion = rootProject.ext.matrixGradle8Version
def gradle9TestVersion = rootProject.ext.matrixGradle9Version
def baseTestTask = tasks.named('test', Test)

def configureGradleMatrixTest = { Test task, String gradleVersion ->
    task.group = 'verification'
    task.description = "Runs TestKit tests using Gradle ${gradleVersion}."
    task.useJUnitPlatform()
    task.systemProperty 'agentDocs.test.gradleVersion', gradleVersion
    task.testClassesDirs = baseTestTask.get().testClassesDirs
    task.classpath = baseTestTask.get().classpath
    task.dependsOn tasks.named('pluginUnderTestMetadata')
}

tasks.register('testGradle8', Test) {
    configureGradleMatrixTest(it, gradle8TestVersion)
}

tasks.register('testGradle9', Test) {
    configureGradleMatrixTest(it, gradle9TestVersion)
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

gradlePlugin {
    website = 'https://github.com/duckasteroid/agent-docs'
    vcsUrl  = 'https://github.com/duckasteroid/agent-docs'

    plugins {
        agentDocsPublish {
            id = 'io.github.duckasteroid.agent-docs.publish'
            implementationClass = 'io.github.duckasteroid.agentdocs.publish.AgentDocsPublishPlugin'
            displayName = 'Agent Docs Publish Plugin'
            tags  = ['AI Agent', 'documentation', 'publishing']
            description = 'Packages curated agent docs for a library into a sidecar archive.'
        }
    }
}
