plugins {
    id 'application'
    id 'org.graalvm.buildtools.native' version '0.10.6'
}

def generatedVersionResourceDir = layout.buildDirectory.dir("generated/resources/main")
def generatedVersionResourceFile = generatedVersionResourceDir.map { it.file("version.info") }
def mcpServerVersion = providers.provider { version.toString() }
def nativeImageMetadataDir = layout.projectDirectory.dir("src/main/resources/META-INF/native-image")
def tracingAgentEnabled = providers.gradleProperty("agentDocs.enableTracingAgent")
        .map { it.toBoolean() }
        .orElse(false)

tasks.register("generateVersionResource") {
    outputs.file(generatedVersionResourceFile)

    doLast {
        def outputFile = generatedVersionResourceFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = mcpServerVersion.get() + System.lineSeparator()
    }
}

sourceSets {
    main {
        resources {
            srcDir(generatedVersionResourceDir)
        }
    }
}

tasks.named("processResources") {
    dependsOn(tasks.named("generateVersionResource"))
}

dependencies {
    implementation 'io.modelcontextprotocol.sdk:mcp-core:1.1.2'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson2:1.1.2'
    implementation 'com.vladsch.flexmark:flexmark-all:0.64.8'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()

    if (tracingAgentEnabled.get()) {
        systemProperty(
                'agentDocs.mcp.integration.server.javaAgentArgs',
                "-agentlib:native-image-agent=config-merge-dir=${nativeImageMetadataDir.asFile.absolutePath}"
        )
        systemProperty('agentDocs.mcp.integration.timeoutSeconds', '60')
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'io.github.duckasteroid.agentdocs.mcp.Application'
}

graalvmNative {
    toolchainDetection = true
    binaries {
        main {
            imageName = 'agent-docs-mcp'
            buildArgs.add('--no-fallback')
        }
    }
}


