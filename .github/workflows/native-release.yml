name: Native Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: native (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            ext: ''
          - os: windows-latest
            label: windows-x64
            ext: '.exe'
          - os: macos-13
            label: macos-x64
            ext: ''
          - os: macos-14
            label: macos-arm64
            ext: ''

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GraalVM 21 + native-image
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: '21'
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build native image (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-configuration-cache :agent-docs-mcp:nativeCompile

      - name: Build native image (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon --no-configuration-cache :agent-docs-mcp:nativeCompile

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: agent-docs-mcp-${{ matrix.label }}
          path: agent-docs-mcp/build/native/nativeCompile/agent-docs-mcp${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: release assets
    needs: native
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download matrix artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: agent-docs-mcp-*
          path: dist

      - name: Prepare unique release asset names
        run: |
          set -euo pipefail
          mkdir -p release-assets
          TAG="${GITHUB_REF_NAME}"

          shopt -s nullglob
          for dir in dist/agent-docs-mcp-*; do
            label="${dir#dist/agent-docs-mcp-}"
            if [[ -f "${dir}/agent-docs-mcp.exe" ]]; then
              cp "${dir}/agent-docs-mcp.exe" "release-assets/agent-docs-mcp-${TAG}-${label}.exe"
            elif [[ -f "${dir}/agent-docs-mcp" ]]; then
              cp "${dir}/agent-docs-mcp" "release-assets/agent-docs-mcp-${TAG}-${label}"
            else
              echo "Expected native binary not found in ${dir}" >&2
              find "${dir}" -maxdepth 2 -type f -print
              exit 1
            fi
          done

          ls -la release-assets

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
